[project]
name = "dseu-fork"
version = "0.1.0"
description = "A pytorch rewrite of the original DSEU"
authors = [ ]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "torch>=2.13.0",
    "torchinfo>=1.8.0",
    "torchvision>=0.28.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.1.0,<5.0.0a0",
    "jupyterlab-lsp>=5.3.0",
    "python-lsp-server[all]>=1.15.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"
